name: Inference CPU smoke

on:
  pull_request:
    paths:
      - 'inference/**'
      - '.github/workflows/inference-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Import, record, import and report without devices or torch
        working-directory: inference
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -S -m unittest discover -s tests -v

  model-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install CPU-only test runtime
        run: |
          python -m pip install numpy==2.2.6
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Model execution, Oracle and training contracts without devices or downloaded models
        working-directory: inference
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          OMP_NUM_THREADS: '1'
        run: >-
          python -B -m unittest -v
          tests.test_review_regressions tests.test_vendor_load tests.test_runner_pooling
          tests.test_training tests.test_training_ctr tests.test_training_embedding
          tests.test_training_rerank tests.test_training_registry

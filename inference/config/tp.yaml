# Inherits accuracy/performance defaults from default.yaml. --devices overrides this example.
runtime:
  parallelism: tp
  devices: [0, 1]
  timeout_seconds: 1800
container:
  shm_size: 8g
vendors:
  ascend:
    env:
      HCCL_EXEC_TIMEOUT: '300'
      HCCL_CONNECT_TIMEOUT: '120'
      HCCL_NPU_SOCKET_PORT_RANGE: '41000,41050'

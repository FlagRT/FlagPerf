[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flagperf-inference"
version = "0.1.0"
description = "Process-level inference profiling, evidence stores, and offline diagnostics"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
flagprof = "flagprof.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["flagprof*"]
namespaces = false

[tool.setuptools.package-data]
"flagprof.vendors.ascend" = ["registry.json", "contracts/*.json"]
"flagprof.vendors.nvidia" = ["contracts/*.json"]

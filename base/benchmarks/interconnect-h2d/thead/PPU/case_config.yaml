# thead PPU interconnect-h2d bounded case. The chip layer carries the
# whole bounded copy contract: one 512 MiB preallocated float32 payload,
# pageable blocking copy as the base variant, MODE measured (the qualification
# audit reuses the measured-mode gates).
# Window calibration (day-5, probes/day5 pageable run + case_config.calibration.yaml pinned run): 43.97 ms/iter pageable (12.21 GB/s) and 18.622 ms/iter pinned (28.83 GB/s) at 512 MiB over 64-iteration bounded runs. ITERS=400 targets ~17.5 s, above the 15 s qualification floor with ~17% margin.
PAYLOAD_BYTES: 536870912
WARMUP: 10
ITERS: 400
SEED: 519
DIRECTION: h2d
PIN_MEMORY: false
NON_BLOCKING: false
REUSE_DESTINATION: true
DTYPE: float32
DIST_BACKEND: gloo
IMPLEMENTATION: native-xpytorch
MODE: measured
FAULT_MODE: none

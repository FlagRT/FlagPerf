# thead PPU main_memory-capacity bounded case. Layered after the generic
# case_config.yaml; INITSIZE 8192 MiB keeps the P800 search start while the
# 96 GiB PPU card bounds requests by free memory (BOUND_REQUEST_BY_FREE_MEMORY)
# and reports only allocations actually held. High-risk single validation per
# the plan: one search run on day 7, not a five-run qualification group.
INITSIZE: 8192
MIN_MIB: 1
DTYPE: float32
DIST_BACKEND: gloo
IMPLEMENTATION: native-xpytorch
BOUND_REQUEST_BY_FREE_MEMORY: true
POST_TEST_WAIT_SECONDS: 0
MODE: capacity  # search-type case; the 15 s bandwidth-window rule does not apply

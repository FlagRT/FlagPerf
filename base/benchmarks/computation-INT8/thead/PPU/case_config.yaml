# thead PPU computation-INT8 bounded case. Layered after the generic
# case_config.yaml; the generic MPI backend, 4096 shape and 10000 iterations
# are overridden here on purpose (merged DIST_BACKEND is gloo).
# Kernel and window calibration (day-5, probes/day5 on the result root): torch._int_mm measures
# 6236 ms per 8192^3 iteration (0.176 TOPS; first iteration 6.80 s, steady
# from the second), so the bounded window is WARMUP=2, ITERS=3
# (3 x 6.236 s = 18.7 s >= 15 s floor + 25% margin). The naive-kernel rate is
# a recorded PPU-stack limitation, not a configuration choice; the measurement
# shape stays at the 8192-cube P800 comparison baseline (R16: fewer
# iterations, never a smaller cube). Zero tolerance: int32 accumulation of
# int8 operands is exact.
M: 8192
N: 8192
K: 8192
WARMUP: 2
ITERS: 3
SEED: 519
ATOL: 0
RTOL: 0
DTYPE: int8
OPERATOR: torch._int_mm
DIST_BACKEND: gloo
IMPLEMENTATION: native-xpytorch
MODE: qualification
FAULT_MODE: none
